<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c3d2e">
  <meta name="description" content="Education stories with a short summary and a link to the publisher.">
  <meta name="apple-mobile-web-app-title" content="Edulens360">
  <title>Edulens360</title>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <link rel="stylesheet" href="/app/styles.css">
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/"><img src="/app/logo.svg" alt="Edulens360"></a>
      <nav>
        <a id="nav-latest" href="#/">Latest</a>
        <a id="nav-saved" href="#/saved">Saved</a>
      </nav>
    </div>
    <form id="search" role="search">
      <input id="search-input" type="search" name="q" placeholder="Search headlines" enterkeyhint="search" aria-label="Search headlines">
      <button type="submit">Search</button>
    </form>
    <div id="categories" class="categories"></div>
  </header>
  <main id="main"><p class="notice">Loading stories…</p></main>
  <script src="/app/app.js"></script>
</body>
</html>
