<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c3d2e">
  <meta name="description" content="Latest Ghana education news on teachers, exams, universities, scholarships, and schools, with a short summary and a link to the original report.">
  <link rel="canonical" href="https://edulens360.com/">
  <meta property="og:title" content="Edulens360 — Ghana education news">
  <meta property="og:description" content="Latest Ghana education news on teachers, exams, universities, scholarships, and schools, with a short summary and a link to the original report.">
  <meta property="og:url" content="https://edulens360.com/">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://edulens360.com/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="apple-mobile-web-app-title" content="Edulens360">
  <title>Edulens360 — Ghana education news</title>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Edulens360",
      "url": "https://edulens360.com/",
      "description": "Latest Ghana education news on teachers, exams, universities, scholarships, and schools, with a short summary and a link to the original report.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://edulens360.com/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
  </script>
  <link rel="manifest" href="/app/manifest.webmanifest">
  <link rel="icon" href="/app/icon-192.png">
  <link rel="apple-touch-icon" href="/app/icon-192.png">
  <link rel="stylesheet" href="/app/styles.css?v=7">
</head>
<body>
  <header>
    <div class="bar">
      <a class="brand" href="#/"><img src="/app/logo.svg" alt="Edulens360" width="64" height="56"></a>
    </div>
    <form id="search" role="search">
      <input id="search-input" type="search" name="q" placeholder="Search headlines" enterkeyhint="search" aria-label="Search headlines">
      <button type="submit">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
          <circle cx="10.5" cy="10.5" r="6.25" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M15.2 15.2L20.5 20.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        Search
      </button>
    </form>
    <div id="categories" class="categories"></div>
  </header>
  <main id="main"><p class="notice">Loading stories…</p></main>
  <script>
    if ("serviceWorker" in navigator) {
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (refreshing) return;
        refreshing = true;
        location.reload();
      });
    }
  </script>
  <script src="/app/app.js?v=7"></script>
</body>
</html>
