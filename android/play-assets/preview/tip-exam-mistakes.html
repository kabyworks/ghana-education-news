<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Edulens360 tip image</title>
  <style>
    :root {
      --paper: #f3efe6;
      --card: #fffdf8;
      --line: #ddd4c6;
      --green: #1c3d2e;
      --green-deep: #163226;
      --green-mid: #24503c;
      --green-soft: #e7f0eb;
      --gold: #e6c56a;
      --ink: #1d1a16;
      --muted: #5c564c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1080px;
      height: 1080px;
      overflow: hidden;
    }
    body {
      font-family: "Segoe UI", "Avenir Next", sans-serif;
      color: var(--paper);
      background: var(--green);
      position: relative;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 65% 50% at 90% 8%, rgba(230, 197, 106, 0.2), transparent 58%),
        radial-gradient(ellipse 45% 40% at 6% 94%, rgba(243, 239, 230, 0.1), transparent 52%),
        linear-gradient(145deg, var(--green-deep) 0%, var(--green) 50%, var(--green-mid) 100%);
    }
    .frame {
      position: absolute;
      inset: 48px;
      border: 1px solid rgba(243, 239, 230, 0.22);
      padding: 48px;
      display: flex;
      flex-direction: column;
    }
    .top {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .logo {
      width: 108px;
      height: 96px;
      background: var(--paper);
      display: grid;
      place-items: center;
      padding: 10px;
      flex: 0 0 auto;
    }
    .logo img {
      width: 84px;
      height: auto;
      display: block;
    }
    .eyebrow {
      font-size: 22px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }
    .brand {
      font-size: 40px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
      color: var(--paper);
    }
    .panel {
      margin-top: 42px;
      flex: 1;
      background: var(--paper);
      color: var(--ink);
      border: 1px solid var(--line);
      padding: 48px 44px 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .number {
      font-size: 148px;
      line-height: 0.82;
      font-weight: 700;
      letter-spacing: -0.06em;
      color: var(--green);
      margin-bottom: 8px;
    }
    .title {
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
      font-size: 54px;
      line-height: 1.12;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      max-width: 860px;
    }
    .sub {
      margin-top: 22px;
      font-size: 28px;
      line-height: 1.4;
      color: var(--muted);
      max-width: 780px;
      font-weight: 500;
    }
    .bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid rgba(28, 61, 46, 0.18);
    }
    .chip {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green-soft);
      color: var(--green);
      font-size: 22px;
      font-weight: 700;
      padding: 12px 18px;
    }
    .rule {
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="frame">
    <div class="top">
      <div class="logo"><img src="logo.svg" alt="Edulens360"></div>
      <div>
        <div class="eyebrow">Edulens360 tip</div>
        <div class="brand">For students</div>
      </div>
    </div>
    <div class="panel">
      <div>
        <div class="number">7</div>
        <div class="title">Exam mistakes that quietly steal grades</div>
        <div class="sub">Even when students already know the answers.</div>
      </div>
      <div class="bottom">
        <div class="chip">Examinations</div>
        <div class="rule">Protect the marks you earned</div>
      </div>
    </div>
  </div>
</body>
</html>
